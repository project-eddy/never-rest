name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Type performance
        run: pnpm perf:check

      - name: Build
        run: pnpm build

      - name: Examples typecheck
        run: pnpm examples:typecheck

      - name: Publint
        run: pnpm exec publint

      - name: Are the types wrong?
        run: pnpm exec attw --pack --profile esm-only
