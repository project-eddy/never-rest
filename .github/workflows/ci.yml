name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::Base commit $BASE_SHA is not available; cannot verify CHANGELOG.md."
            exit 1
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::Every pull request must update CHANGELOG.md under ## [Unreleased]. See AGENTS.md. Dependabot and chore PRs use ### Internal."
          exit 1

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      - name: Specs lint
        run: pnpm specs:lint

      - name: Type performance
        run: pnpm perf:check

      - name: Build
        run: pnpm build

      - name: Docs build
        run: pnpm docs:build

      - name: Examples conformance
        run: pnpm exec vitest run --config examples/conformance/vitest.config.ts

      - name: Examples typecheck
        run: pnpm examples:typecheck

      - name: Publint
        run: pnpm exec publint

      - name: Are the types wrong?
        run: pnpm exec attw --pack --profile esm-only

  openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Spectral lint
        run: pnpm openapi:lint

      - name: Fetch PR base for oasdiff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0.1.12
        with:
          base: "origin/${{ github.base_ref }}:src/openapi/fixtures/fixture-openapi.json"
          revision: "HEAD:src/openapi/fixtures/fixture-openapi.json"
          fail-on: ERR
          review: false
