name: Release to npm

# Publishes the package to npm whenever a semver tag like v1.0.0 is pushed.
# Uses npm trusted publishing via GitHub Actions OIDC; no NPM_TOKEN secret is required.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      - name: Specs lint
        run: pnpm specs:lint

      - name: Type performance
        run: pnpm perf:check

      - name: Build
        run: pnpm build

      - name: Docs build
        run: pnpm docs:build

      - name: Examples conformance
        run: pnpm exec vitest run --config examples/conformance/vitest.config.ts

      - name: Examples typecheck
        run: pnpm examples:typecheck

      - name: Publint
        run: pnpm exec publint

      - name: Are the types wrong?
        run: pnpm exec attw --pack --profile esm-only

      - name: Publish to npm with trusted publishing
        run: npm publish --access public
